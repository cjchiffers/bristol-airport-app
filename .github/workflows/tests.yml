name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit + worker tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Note: the worker lives in CloudFlare/, which is git-ignored, so on CI the worker tests skip themselves.
      # Remove "/CloudFlare" from .gitignore (it holds no secrets) to have CI test the worker too.
      - run: npm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q
